<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet" />
  <title>Thank You — Indigenous Lifestyle Y2K Party</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #0d001a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(255,0,144,0.3) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(0,68,255,0.2) 0%, transparent 55%);
    }
    .card {
      position: relative;
      z-index: 2;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(255,0,144,0.3);
      border-radius: 24px;
      padding: 56px 44px;
      text-align: center;
      max-width: 440px;
      width: 90%;
      animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 80px rgba(255,0,144,0.15);
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .emoji { font-size: 3.5rem; margin-bottom: 16px; animation: bounce 1s 0.5s ease both; display: block; }
    @keyframes bounce {
      0% { transform: scale(0); }
      60% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    h1 {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 2.4rem;
      color: #ff0090;
      margin-bottom: 14px;
      -webkit-text-stroke: 1px rgba(255,230,0,0.3);
    }
    p {
      font-size: 1rem;
      color: rgba(255,255,255,0.6);
      line-height: 1.7;
      margin-bottom: 10px;
    }
    .highlight {
      color: #ffe600;
      font-weight: 800;
    }
    .back-link {
      display: inline-block;
      margin-top: 28px;
      color: rgba(255,255,255,0.3);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #ff0090; }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="card">
    <span class="emoji">🎉</span>
    <h1>You're In!</h1>
    <p>Your registration has been received.<br/>
    <span class="highlight">Check your email</span> — your QR entry pass will be sent once your payment is confirmed.</p>
    <p style="font-size:0.82rem;color:rgba(255,255,255,0.3);">Nov 7, 2026 · Indigenous Lifestyle Y2K Party</p>
    <a class="back-link" href="/">← Back to site</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    window.onload = () => {
      // Pink & blue confetti
      confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 }, colors: ['#ff0090', '#0044ff', '#ffe600', '#ffffff', '#aa44ff'] });
      setTimeout(() => confetti({ particleCount: 60, spread: 100, origin: { y: 0.5 }, colors: ['#ff0090', '#ffe600'] }), 600);
    };
  </script>
</body>
</html>
